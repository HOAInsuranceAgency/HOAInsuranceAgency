name: Repository verification

on:
  pull_request:
    branches: [main, staging]
  push:
    branches: [main, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Tests, types, builds and architecture (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            crm/package-lock.json
            web/package-lock.json
            .github/blog/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix crm --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
          npm ci --prefix .github/blog --no-audit --no-fund
      - name: Verify blog automation
        run: npm test --prefix .github/blog
      - name: Verify repository
        run: npm run verify
