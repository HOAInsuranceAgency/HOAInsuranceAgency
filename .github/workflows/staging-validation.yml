name: Staging validation

on:
  pull_request:
    branches: [staging]
  push:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Offline validation (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            crm/package-lock.json
            web/package-lock.json
      - name: Install locked dependencies
        run: |
          npm ci --prefix crm --no-audit --no-fund
          npm ci --prefix web --no-audit --no-fund
      - name: Verify offline tooling
        working-directory: crm
        run: npm run test:verification
      - name: Validate CRM and both backend branches
        working-directory: crm
        run: npm run verify:offline
      - name: Validate website
        working-directory: web
        env:
          AWS_EC2_METADATA_DISABLED: 'true'
          ASTRO_TELEMETRY_DISABLED: '1'
          PUBLIC_ANALYTICS_DISABLED: 'true'
        run: |
          npm run articles:test
          npm run articles:build-test
          npm run typecheck
          npm run build
          npm run seo:check
