# Reference staging build spec. The repository amplify.yml takes precedence over console overrides.
# Active staging checks are invoked by amplify.yml through check-staging-commission-ui.mjs.
# The backend namespace staging stays dormant; this host deploys its retained root.
# Production continues to use amplify.yml and its unchanged main contract.
version: 1
applications:
  - appRoot: crm
    backend:
      phases:
        build:
          commands:
            - export HOA_DEPLOY_ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
            - node scripts/assert-migration-destination.mjs --staging-only
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
            # Check commission setup and login delivery boundaries before applying backend changes.
            - npx vitest run src/pages/Commissions.test.tsx src/test/sesMailInfrastructure.test.ts src/test/sesMailFeedback.test.ts src/test/sesTransactionalMail.test.ts src/test/transactionalMail.test.ts src/test/magicLinkRequest.test.ts src/test/resendCallerContracts.test.ts
            - npm run typecheck:backend
            - npm run synth:check
            - node scripts/deploy-migration-backend.mjs
            - node scripts/assert-migration-destination.mjs --staging-only
    frontend:
      phases:
        build:
          commands:
            - NODE_OPTIONS=--max-old-space-size=6144 npm run build
            - node scripts/prepare-migration-preview.mjs
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
