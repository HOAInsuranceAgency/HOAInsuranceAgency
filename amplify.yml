version: 1
applications:
  # ── Marketing site (protectmyhoa.com) ──────────────────────────────
  - appRoot: web
    frontend:
      phases:
        preBuild:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            # A push starts two independent apps. Keep the currently deployed
            # website until the CRM accepts this bundle's submission contract.
            - node scripts/wait-for-intake-contract.mjs
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*

  # ── CRM (Amplify Gen 2 backend + Vite SPA) ─────────────────────────
  - appRoot: crm
    backend:
      phases:
        build:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
            # `ampx` bundles the handlers with esbuild, which strips types
            # without checking them, and the frontend's `tsc -b` covers only
            # `src`. Without this line nothing type-checks amplify/ — a broken
            # handler deploys clean and fails in production. Runs before
            # pipeline-deploy so a type error stops the deploy rather than
            # being reported after it.
            - npm run typecheck:backend
            - npx ampx pipeline-deploy --branch $AWS_BRANCH --app-id $AWS_APP_ID
    frontend:
      phases:
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
