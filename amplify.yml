# TEMPORARY: staging integration branch only. Do not include in production PRs.
# The backend phase only reads outputs from the retained staging backend.
# No pipeline-deploy, synth, backend construction or migration release occurs.
version: 1
applications:
  - appRoot: crm
    backend:
      phases:
        build:
          commands:
            - nvm install 22
            - nvm use 22
            - npm ci --cache .npm --prefer-offline
            - node scripts/assert-staging-frontend.mjs --before-outputs
            - npx ampx generate outputs --branch staging --app-id d1nuh9rw1hcuxo
            - node scripts/assert-staging-frontend.mjs --outputs amplify_outputs.json
    frontend:
      phases:
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
