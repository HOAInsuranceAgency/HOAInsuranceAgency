# Premium finance — signed-off compliance data.
#
# This file is DATA, not code. It is signed off by a human and the application
# only reads it (via the generated module — run `npm run pf:generate` after any
# edit; the drift test fails until the generated copy matches). Never edit this
# file to make a test pass.
#
# Encoding notes, agreed 2026-08-21:
# - The source table renders max_apr and max_apr_verified as "—" on closed
#   rows (not applicable). Encoded here as max_apr: null and
#   max_apr_verified: true, because the verified flag only has force on
#   non-closed rows — closed is closed either way — and encoding false would
#   miscount the "unverified" rows, which are exactly Arkansas and Rhode Island.
# - Ohio's note in the source table ended with an instruction to the
#   implementer ("set min_principal: 100000"), executed as the field below and
#   trimmed from the user-facing note text.
# - Flood is deliberately on NEITHER coverage list. It is resolved in logic:
#   allowed only for ASSOCIATION accounts, blocked otherwise. See the spec.
#
# status: open | conditional | closed
# max_apr: percent, null = no statutory cap
# max_apr_verified: false = treat the jurisdiction as CLOSED until resolved
# min_principal: minimum amount financed (Ohio only)
# note: shown to the user when blocked

jurisdictions:
