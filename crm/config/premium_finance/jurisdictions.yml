# Coverage lines. A legal rule, so it gets the same treatment as the
# jurisdictions: signed here, generated into code, drift-tested.
# Matching is on normalized tokens; anything matching neither list BLOCKS.
# Flood is deliberately absent — see the encoding notes above.
coverage_lines:
  allow:
    - Commercial Property
    - General Liability
    - Umbrella
    - Excess Liability
    - Directors & Officers
    - Crime
    - Fidelity
    - Employee Dishonesty
    - Workers Compensation
    - Equipment Breakdown
    - Boiler & Machinery
    - Ordinance or Law
    - Earthquake
    - Terrorism / TRIA
    - Cyber
    - Employment Practices Liability
    - Commercial Auto
    - Pollution / Environmental
    - Builders Risk
  deny:
    - HO-3
    - HO-4
    - HO-6
    - Homeowners
    - Condo Unit Owner
    - Renters
    - Personal Umbrella
    - Personal Auto
    - Dwelling Fire
    - Personal Inland Marine
