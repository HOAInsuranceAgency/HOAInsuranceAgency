applications:
  # Both independent Amplify apps read this root file, including the website
  # which needs no additional headers.
  - appRoot: web
    customHeaders: []
  - appRoot: crm
    customHeaders:
      - pattern: '/front-sidebar*'
        headers:
          - key: 'Content-Security-Policy'
            value: "frame-ancestors 'self' https://*.frontapp.com https://*.front.com"
          - key: 'Cache-Control'
            value: 'no-store'
          - key: 'Referrer-Policy'
            value: 'no-referrer'
